<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Talyer Tally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#121A22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-width app shell, sticky header, scrolling view, floating pill nav with raised centre "new job" button */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#131B23; --muted:#5B6976; --line:#D8DEE4;
  --accent:#E2552B; --accent-ink:#FFFFFF; --accent-soft:#FBE3DA;
  --nav:#131B23; --nav-ink:#9FB0BE; --nav-active:#FFFFFF;
  --wait:#8A6400; --wait-bg:#FFF1C2; --repair:#1E5DAA; --repair-bg:#DCE8F8;
  --ready:#6A3DBE; --ready-bg:#EAE2FA; --paid:#1B7647; --paid-bg:#D8F1E3; --danger:#C2332B; --danger-bg:#FBE0DE;
  --plate:#FFFFFF; --plate-ink:#0E1419;
  --shadow:0 1px 2px rgba(19,27,35,.06),0 4px 14px rgba(19,27,35,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --surface-2:#1E2933; --ink:#E7EDF2; --muted:#93A3B1; --line:#2A3743;
  --accent:#FF6B3D; --accent-ink:#1A0D07; --accent-soft:#3B2219;
  --nav:#22303C; --nav-ink:#8A9CAB; --nav-active:#FFFFFF;
  --wait:#F2C94C; --wait-bg:#3A3112; --repair:#7DB2F5; --repair-bg:#16304F; --ready:#B79BF5; --ready-bg:#2D2148;
  --paid:#6BD69C; --paid-bg:#163828; --danger:#FF8A80; --danger-bg:#3D1C1A; --plate:#E9EEF2; --plate-ink:#0E1419;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --surface-2:#1E2933; --ink:#E7EDF2; --muted:#93A3B1; --line:#2A3743;
  --accent:#FF6B3D; --accent-ink:#1A0D07; --accent-soft:#3B2219;
  --nav:#22303C; --nav-ink:#8A9CAB; --nav-active:#FFFFFF;
  --wait:#F2C94C; --wait-bg:#3A3112; --repair:#7DB2F5; --repair-bg:#16304F; --ready:#B79BF5; --ready-bg:#2D2148;
  --paid:#6BD69C; --paid-bg:#163828; --danger:#FF8A80; --danger-bg:#3D1C1A; --plate:#E9EEF2; --plate-ink:#0E1419;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;letter-spacing:.2px;line-height:1.05;text-wrap:balance}
.top .eyebrow{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.top .grow{flex:1;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);font-size:16px;flex:none;background:var(--ink);color:var(--bg)}
.avatar.sm{width:30px;height:30px;border-radius:10px;font-size:13px}
.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 130px;display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-6px}
.sec-h h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700}
.sec-h .link{color:var(--accent);font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px}
.sec-h .link svg{width:16px;height:16px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.tile .ic svg{width:18px;height:18px}
.tile .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tile .l{font-size:13px;color:var(--muted);font-weight:500}
.tile.hero{grid-column:1/-1;background:var(--ink);color:var(--bg);flex-direction:row;align-items:center;justify-content:space-between}
.tile.hero .l{color:inherit;opacity:.7}
.tile.hero .v{font-size:32px}
.tile.hero .ic{background:var(--accent);color:var(--accent-ink);width:48px;height:48px;border-radius:15px}
.tile.hero .ic svg{width:24px;height:24px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:center}
.qa span.b{width:58px;height:58px;border-radius:18px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--accent)}
.qa span.b svg{width:24px;height:24px}

/* cards & lists */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.job{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.job .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.job .mi svg{width:24px;height:24px}
.job .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.job .t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.job .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.plate{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;background:var(--plate);color:var(--plate-ink);border:1.5px solid var(--plate-ink);border-radius:5px;padding:0 5px;line-height:17px;white-space:nowrap}
.plate.big{font-size:20px;line-height:30px;padding:0 12px;border-width:2.5px;border-radius:7px;letter-spacing:.1em}
.jo{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.s-queue{background:var(--wait-bg);color:var(--wait)} .s-repair{background:var(--repair-bg);color:var(--repair)}
.s-ready{background:var(--ready-bg);color:var(--ready)} .s-paid{background:var(--paid-bg);color:var(--paid)}
.s-low{background:var(--danger-bg);color:var(--danger)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface);font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow);flex:none}
.chip svg{width:16px;height:16px}
.chip .n{font-size:11.5px;background:var(--surface-2);border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.on .n{background:rgba(127,127,127,.3)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--shadow)}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:13px 0;outline:none;font-size:15px}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .ci{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.row .ci svg{width:20px;height:20px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;line-height:1.25}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:12px;flex:none}
.stepper button{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.stepper button svg{width:16px;height:16px}
.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15.5px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:9px 13px;font-size:13.5px;width:auto;border-radius:12px}
.btn.sm svg{width:17px;height:17px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* job detail */
.jhero{display:flex;flex-direction:column;gap:12px}
.jhero .top-r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.jhero .model{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;align-items:center}
.kv .k{display:flex;align-items:center;gap:6px;color:var(--muted)}
.kv .k svg{width:16px;height:16px}
.kv .v{font-weight:600;min-width:0;overflow-wrap:anywhere}
.problem{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px}
.problem svg{width:17px;height:17px;flex:none;color:var(--muted);margin-top:1px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
.track .st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;position:relative}
.track .st i,.track .st svg{width:34px;height:34px;border-radius:50%;padding:8px;background:var(--surface-2);position:relative;z-index:1}
.track .st.done svg{background:var(--ink);color:var(--bg)}
.track .st.cur svg{background:var(--accent);color:var(--accent-ink)}
.track .st.cur{color:var(--ink)}
.track .st:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:var(--line)}
.track .st.done::after{background:var(--ink)}
.sum{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.sum .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .l span:first-child{color:var(--muted);display:flex;align-items:center;gap:6px}
.sum .l svg{width:16px;height:16px}
.sum .tot{border-top:2px dashed var(--line);padding-top:10px;margin-top:2px;font-size:15px;font-weight:700;align-items:baseline}
.sum .tot span:first-child{color:var(--ink)}
.sum .tot .big{font-family:var(--f-display);font-size:30px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;color:var(--muted);text-align:center;font-size:14px}
.empty svg{width:34px;height:34px;opacity:.6}
.who{display:inline-flex;align-items:center;gap:4px}
.who svg{width:13px;height:13px}

/* floating nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 48px));
  background:var(--nav);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:7px 8px;z-index:40;box-shadow:0 10px 30px rgba(10,15,20,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--nav-ink);font-size:10.5px;font-weight:600;padding:6px 0;border-radius:16px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--nav-active)}
.nav button.on svg{stroke-width:2.5}
.nav button.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:1px}
.nav button:not(.on)::after{content:"";width:5px;height:5px;margin-top:1px}
.nav .fab{width:56px;height:56px;border-radius:19px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px rgba(226,85,43,.45);border:4px solid var(--bg);padding:0}
.nav .fab svg{width:26px;height:26px;stroke-width:2.6}
.nav .fab::after{display:none}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;max-height:90%;background:var(--bg);z-index:61;
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}
.sheet .sh h3{flex:1;margin:0;font-family:var(--f-display);font-size:21px;font-weight:700}
.sheet .sh .icon-btn{width:36px;height:36px;border-radius:12px}
.sheet .sb{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sb>*{flex-shrink:0}
.chips{flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.field label svg{width:15px;height:15px}
.inp{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:none;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-chips{display:flex;flex-wrap:wrap;gap:6px}
.mini-chips button{padding:6px 10px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:600}
.mini-chips button.on{border-color:var(--accent);background:var(--accent-soft)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pick button{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center}
.pick button svg{width:24px;height:24px}
.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.stock{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.stock.low{color:var(--danger)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);width:64px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--paid);border-radius:3px}
.bar i.low{background:var(--danger)}
.change{display:flex;justify-content:space-between;align-items:center;background:var(--paid-bg);color:var(--paid);border-radius:14px;padding:12px 14px;font-weight:700}
.change .v{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.change.neg{background:var(--danger-bg);color:var(--danger)}

/* receipt */
.receipt{background:#FFFDF8;color:#1A1A1A;border-radius:6px;padding:20px 18px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;
  -webkit-mask:radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) 0 0/16px 100% repeat-x;mask:radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) -8px 0/16px 100% repeat-x;padding-bottom:28px}
.receipt .c{text-align:center}
.receipt .shop{font-family:var(--f-display);font-size:20px;font-weight:700}
.receipt hr{border:0;border-top:1.5px dashed #999;margin:10px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .ln span:first-child{min-width:0;overflow-wrap:anywhere}
.receipt .gt{font-size:16px;font-weight:600}

/* menu & reports */
.menu .row{padding:14px 0}
.menu .row .ci{color:var(--accent);background:var(--accent-soft)}
.menu .row svg.chev{width:18px;height:18px;color:var(--muted)}
.chart-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px;scrollbar-width:thin}
.chart{display:grid;gap:8px;align-items:end;height:150px;padding-top:18px}
.chart .c.out{opacity:.4}
.range-card{display:flex;flex-direction:column;gap:10px}
.range-note{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.req{color:var(--accent);margin-left:-2px}
.opt{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
.inp.err{border-color:var(--danger);background:var(--danger-bg)}
.form-note{margin:0;font-size:13px;color:var(--muted)}
.chart .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.chart .c .b{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--line);position:relative}
.chart .c.today .b{background:var(--accent)}
.chart .c .val{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .c .d{font-size:11.5px;font-weight:600;color:var(--muted)}
.hbar{display:flex;flex-direction:column;gap:5px}
.hbar .top-l{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.hbar .top-l b{font-variant-numeric:tabular-nums}
.hbar .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.role-banner{display:flex;align-items:center;gap:10px;background:var(--repair-bg);color:var(--repair);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600}
.role-banner svg{width:18px;height:18px;flex:none}

const ic=(n,cls='')=>`<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const MOTO='<svg class="moto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="16.5" r="3"/><circle cx="19" cy="16.5" r="3"/><path d="M5 16.5h3l3-5h4.5l3.5 5"/><path d="M14 11.5 12.5 7H16"/><path d="M8.5 11.5H11"/></svg>';
const hhmm=t=>new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
const isToday=t=>dayKey(t)===dayKey(Date.now());
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromIso=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const dshort=t=>new Date(t).toLocaleDateString('en-PH',{month:'short',day:'numeric'});
const plateTag=(p,big)=>p?`<span class="plate${big?' big':''}">${esc(p)}</span>`:'';
const ckey=j=>j.moto.plate||('~'+j.customer.name.toLowerCase());
const when=t=>isToday(t)?hhmm(t):new Date(t).toLocaleDateString('en-PH',{month:'short',day:'numeric'})+' · '+hhmm(t);
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+'h '+(m%60)+'m ago'};
const job=id=>S.jobs.find(j=>j.id===id);
const part=id=>S.parts.find(p=>p.id===id);
const mech=id=>S.mechanics.find(m=>m.id===id);
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const isOwner=()=>S.role==='owner';
const me=()=>isOwner()?{name:'Boss '+S.shop.owner,short:S.shop.owner}:mech(S.role);
const myId=()=>isOwner()?'owner':S.role;
function totals(j){const parts=j.items.reduce((a,x)=>a+x.price*x.qty,0);const labor=j.labor.reduce((a,x)=>a+Number(x.amount),0);const sub=parts+labor;return{parts,labor,sub,discount:Math.min(j.discount||0,sub),total:Math.max(0,sub-(j.discount||0)),count:j.items.reduce((a,x)=>a+x.qty,0)}}
const pill=s=>`<span class="pill s-${s}">${ic(ST[s].icon)}${ST[s].label}</span>`;
const lowParts=()=>S.parts.filter(p=>p.stock<=p.min);
function toast(msg,icon='check'){const t=$('#toast');t.innerHTML=ic(icon)+esc(msg);icons();t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1900)}
function icons(){document.querySelectorAll('i[data-lucide]').forEach(i=>{i.outerHTML=ic(i.dataset.lucide)})}

/* ===== Router ===== */
let R={name:'home',id:null,back:null};
const UI={jobFilter:'active',jobQ:'',partCat:'all',partQ:'',pickCat:'all',pickQ:'',period:7,from:iso(Date.now()-6*D),to:iso(Date.now())};
function go(name,id=null,back=null){R={name,id,back};render();window.scrollTo(0,0)}

function header(){
  const titles={home:null,jobs:'Job orders',parts:'Parts & stock',more:'More',mechanics:'Mechanics',customers:'Customers',reports:'Reports',settings:'Shop settings'};
  const u=me(); const roleBtn=`<button class="avatar" data-a="roleSheet" aria-label="Switch user" style="${isOwner()?'':'background:var(--repair);color:#fff'}">${esc(initials(u.name))}</button>`;
  const low=lowParts().length;
  if(R.name==='job'){const j=job(R.id);
    return `<button class="icon-btn" data-a="go" data-v="${R.back||'jobs'}" aria-label="Back">${ic('chevron-left')}</button>
      <div class="grow"><div class="eyebrow jo">${esc(j.id)}</div><h1>${esc(j.customer.name)}</h1></div>${roleBtn}`}
  if(R.name==='home'){const h=new Date().getHours();const g=h<11?'Magandang umaga':h<13?'Magandang tanghali':h<18?'Magandang hapon':'Magandang gabi';
    return `<div class="grow"><div class="eyebrow">${esc(S.shop.name)}</div><h1>${g}, ${esc(u.short)}</h1></div>
      <button class="icon-btn" data-a="lowSheet" aria-label="Low stock alerts">${ic('bell')}${low?'<span class="dot"></span>':''}</button>${roleBtn}`}
  const sub=['mechanics','customers','reports','settings'].includes(R.name);
  return `${sub?`<button class="icon-btn" data-a="go" data-v="more" aria-label="Back">${ic('chevron-left')}</button>`:''}
    <div class="grow"><div class="eyebrow">${esc(S.shop.name)}</div><h1>${titles[R.name]}</h1></div>
    ${R.name==='parts'&&isOwner()?`<button class="icon-btn" data-a="partSheet" aria-label="Add part" style="background:var(--accent);color:var(--accent-ink)">${ic('package-plus')}</button>`:''}${roleBtn}`;
}

function render(){
  $('#top').innerHTML=header();
  const V={home,jobs:jobsView,job:jobView,parts:partsView,more:moreView,mechanics:mechView,customers:custView,reports:reportView,settings:settingsView}[R.name];
  $('#view').innerHTML=V();
  const navKey={home:'home',jobs:'jobs',job:'jobs',parts:'parts'}[R.name]||'more';
  document.querySelectorAll('.nav button[id]').forEach(b=>b.classList.toggle('on',b.id==='n-'+navKey));
  icons(); save();
}

/* ===== Views ===== */
function visibleJobs(){return isOwner()?S.jobs:S.jobs.filter(j=>j.mechanicId===S.role)}
function jobCard(j){
  const t=totals(j); const m=mech(j.mechanicId);
  const cls={queue:'s-queue',repair:'s-repair',ready:'s-ready',paid:'s-paid'}[j.status];
  return `<button class="card job" data-a="openJob" data-v="${j.id}">
    <span class="mi ${cls}">${MOTO}</span>
    <span class="mid"><span class="t">${esc(j.moto.model)}</span>
      <span class="s">${plateTag(j.moto.plate)}${esc(j.customer.name.split(' ')[0])} · ${ic('hard-hat','')}${esc(m?m.short:'—')}</span></span>
    <span class="r"><span class="amt">${peso0(t.total)}</span>${pill(j.status)}</span></button>`;
}
function home(){
  const vj=visibleJobs();
  const active=vj.filter(j=>j.status!=='paid').sort((a,b)=>ORDER.indexOf(b.status)-ORDER.indexOf(a.status)||a.created-b.created);
  const paidToday=vj.filter(j=>j.status==='paid'&&isToday(j.payment.paidAt));
  const sales=paidToday.reduce((a,j)=>a+totals(j).total,0);
  const ready=vj.filter(j=>j.status==='ready').length;
  const low=lowParts().length;
  const owner=isOwner();
  return `

function reportRange(){const s=new Date();s.setHours(0,0,0,0);const today=s.getTime();
  if(UI.period==='custom'){let a=fromIso(UI.from),b=fromIso(UI.to);if(a>b)[a,b]=[b,a];return{from:a,to:b+D}}
  return{from:today-(UI.period-1)*D,to:today+D}}
function reportView(){
  const P=UI.period; const {from,to}=reportRange(); const nDays=Math.round((to-from)/D);
  const paid=S.jobs.filter(j=>j.status==='paid'&&j.payment.paidAt>=from&&j.payment.paidAt<to);
  const T=paid.reduce((a,j)=>{const t=totals(j);a.s+=t.total;a.p+=t.parts;a.l+=t.labor;a.d+=t.discount;return a},{s:0,p:0,l:0,d:0});
  const profit=paid.reduce((a,j)=>a+j.items.reduce((b,x)=>b+(x.price-(part(x.partId)?.cost??x.price))*x.qty,0),0);
  const cn=Math.max(7,Math.min(nDays,62)); const cstart=to-cn*D;
  const days=[...Array(cn)].map((_,i)=>{const t=cstart+i*D;const v=S.jobs.filter(j=>j.status==='paid'&&dayKey(j.payment.paidAt)===dayKey(t)).reduce((a,j)=>a+totals(j).total,0);return{t,v,today:isToday(t),out:t<from}});
  const max=Math.max(...days.map(d=>d.v),1);
  const pm={};paid.forEach(j=>{pm[j.payment.method]=(pm[j.payment.method]||0)+totals(j).total});
  const tp={};paid.forEach(j=>j.items.forEach(x=>{tp[x.partId]=tp[x.partId]||{name:x.name,cat:x.cat,q:0,v:0};tp[x.partId].q+=x.qty;tp[x.partId].v+=x.qty*x.price}));
  const top=Object.values(tp).sort((a,b)=>b.v-a.v).slice(0,5);
  const k=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':Math.round(n);
  const label=nDays===1?dshort(from)+', '+new Date(from).getFullYear():dshort(from)+' – '+dshort(to-D)+', '+new Date(to-D).getFullYear();
  return `<div class="chips">${[[1,'Today','sun'],[7,'7 days','calendar-days'],[30,'30 days','calendar-range'],['custom','Custom','calendar-cog']].map(([v,l,i])=>`<button class="chip ${P===v?'on':''}" data-a="period" data-v="${v}">${ic(i)}${l}</button>`).join('')}</div>
  ${P==='custom'?`<div class="card range-card"><div class="grid2">
    <div class="field"><label for="rep-from">${ic('calendar-arrow-up')}From</label><input class="inp" type="date" id="rep-from" data-ch="from" value="${UI.from}" max="${iso(Date.now())}"></div>
    <div class="field"><label for="rep-to">${ic('calendar-arrow-down')}To</label><input class="inp" type="date" id="rep-to" data-ch="to" value="${UI.to}" max="${iso(Date.now())}"></div></div>
    <div class="mini-chips">${[['This month','month'],['Last month','lmonth'],['This year','year']].map(([l,v])=>`<button data-a="rangeQuick" data-v="${v}">${l}</button>`).join('')}</div></div>`:''}
  <div class="range-note">${ic('calendar')}${label} · ${nDays} day${nDays>1?'s':''}</div>
  <div class="tiles">
    <div class="tile hero"><div><div class="l">Total sales · ${paid.length} jobs</div><div class="v">${peso(T.s)}</div></div><span class="ic">${ic('banknote')}</span></div>
    <div class="tile"><span class="ic s-repair">${ic('package')}</span><span class="v">${peso0(T.p)}</span><span class="l">Parts sold</span></div>
    <div class="tile"><span class="ic s-ready">${ic('wrench')}</span><span class="v">${peso0(T.l)}</span><span class="l">Labor</span></div>
    <div class="tile"><span class="ic s-paid">${ic('trending-up')}</span><span class="v">${peso0(profit)}</span><span class="l">Parts profit</span></div>
    <div class="tile"><span class="ic s-low">${ic('percent')}</span><span class="v">${peso0(T.d)}</span><span class="l">Discounts given</span></div>
  </div>
  <div class="card"><div class="sec-h" style="margin:0"><h2>Daily sales</h2></div>
    <div class="chart-wrap" id="chartWrap"><div class="chart" style="grid-template-columns:repeat(${cn},minmax(${cn>7?'34px':'0'},1fr))">${days.map(d=>`<div class="c ${d.today?'today':''} ${d.out?'out':''}"><span class="val">${d.v?'₱'+k(d.v):''}</span><span class="b" style="height:${Math.max(3,d.v/max*100)}px"></span><span class="d">${d.today?'Today':cn>7?(new Date(d.t).getDate()===1||d.t===cstart?dshort(d.t):new Date(d.t).getDate()):new Date(d.t).toLocaleDateString('en-PH',{weekday:'short'})}</span></div>`).join('')}</div></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="sec-h" style="margin:0"><h2>Payments</h2></div>
    ${Object.keys(PAY).map(m=>`<div class="hbar"><div class="top-l"><span style="display:flex;gap:6px;align-items:center">${ic(PAY[m].icon)}${PAY[m].label}</span><b>${peso0(pm[m]||0)}</b></div><div class="tr"><i style="width:${T.s?(pm[m]||0)/T.s*100:0}%"></i></div></div>`).join('')}</div>
  <div class="card" style="padding-block:10px 4px"><div class="sec-h" style="margin:0 0 4px"><h2>Top parts</h2></div>
    ${top.length?top.map(p=>`<div class="row"><span class="ci">${ic(CATS[p.cat].icon)}</span><div class="mid"><div class="t">${esc(p.name)}</div><div class="s">${p.q} pcs sold</div></div><span class="amt">${peso0(p.v)}</span></div>`).join(''):`<div class="empty">No sales in this period.</div>`}</div>`;
}

const val=id=>($('#'+id)?.value??'').trim();
function takePart(jid,pid,delta){
  const j=job(jid),p=part(pid);
  if(delta>0&&p.stock<delta){toast(`Only ${p.stock} left on shelf`,'triangle-alert');return false}
  let it=j.items.find(x=>x.partId===pid&&x.by===myId());
  if(!it){it={partId:pid,name:p.name,cat:p.cat,price:p.price,qty:0,by:myId(),at:Date.now()};j.items.push(it)}
  it.qty+=delta;it.at=Date.now();p.stock-=delta;
  if(j.status==='queue')j.status='repair';
  return true;
}

  addLabor:v=>{const [d,a]=v.split('|');job(SH.args[0]).labor.push({desc:d,amount:+a});closeSheet();render();toast('Labor added')},
  addLaborCustom:()=>{const d=val('lab-d'),a=parseFloat(val('lab-a'));if(!d||!(a>0)){toast('Enter a description and amount','triangle-alert');return}
    job(SH.args[0]).labor.push({desc:d,amount:a});closeSheet();render();toast('Labor added')},
  delLabor:v=>{job(R.id).labor.splice(+v,1);render()},
  discSheet:v=>openSheet(shDisc,v),
  discQuick:v=>{$('#disc').value=v},
  saveDisc:()=>{job(SH.args[0]).discount=Math.max(0,parseFloat(val('disc'))||0);closeSheet();render();toast('Discount applied')},
  assignSheet:v=>openSheet(shAssign,v),
  assign:v=>{job(SH.args[0]).mechanicId=v;closeSheet();render();toast('Assigned to '+mech(v).short)},
  setStatus:v=>{const j=job(R.id);j.status=v;render();toast(v==='repair'?'Repair started':v==='ready'?'Sent to owner for bill-out':'Updated')},
  billSheet:v=>{shBill.b={method:'cash',cash:'',ref:''};openSheet(shBill,v)},
  payMethod:v=>{shBill.b.method=v;paintSheet()},
  cashQuick:v=>{shBill.b.cash=String(v);paintSheet()},
  confirmPay:v=>{const j=job(v);const t=totals(j);const b=shBill.b;
    if(b.method==='cash'&&(parseFloat(b.cash)||0)<t.total){toast('Cash received is less than the total','triangle-alert');return}
    j.status='paid';j.payment={method:b.method,paidAt:Date.now(),cash:b.method==='cash'?parseFloat(b.cash):null,ref:b.ref||null};
    render();openSheet(shReceipt,v);toast('Paid · '+peso(t.total),'badge-check')},
  receipt:v=>openSheet(shReceipt,v),
  copyReceipt:v=>copyText(receiptText(job(v)),'Receipt copied'),
  copy:v=>copyText(v,'Number copied'),
  partSheet:v=>openSheet(shPart,v||null),
  restock:v=>{const e=$('#pf-stock');e.value=(parseInt(e.value)||0)+(+v)},
  savePart:v=>{const name=val('pf-name');const price=parseFloat(val('pf-price'));if(!name||!(price>0)){toast('Add a name and price','triangle-alert');return}
    const data={name,brand:val('pf-brand')||'Generic',cat:val('pf-cat'),price,cost:parseFloat(val('pf-cost'))||0,stock:parseInt(val('pf-stock'))||0,min:parseInt(val('pf-min'))||0};
    if(v)Object.assign(part(v),data);else{const id='p'+(Date.now()%1e6);S.parts.push({id,sku:'SKU-'+String(S.parts.length+1).padStart(4,'0'),...data})}
    closeSheet();render();toast(v?'Part saved':'Part added')},
  delPart:v=>{S.parts=S.parts.filter(p=>p.id!==v);closeSheet();render();toast('Part removed','trash-2')},
  lowSheet:()=>openSheet(shLow),
  roleSheet:()=>openSheet(shRole),
  setRole:v=>{S.role=v;closeSheet();go('home');toast(v==='owner'?'Owner view':'Mechanic view: '+mech(v).short,'user')},
  custSheet:v=>openSheet(shCust,v),
  mechSheet:()=>openSheet(shMech),
  saveMech:()=>{const n=val('mf-name');if(!n){toast('Enter a name','triangle-alert');return}
    S.mechanics.push({id:'m'+Date.now(),name:n,short:n.split(' ')[0],phone:val('mf-phone'),commission:parseFloat(val('mf-com'))||0});closeSheet();render();toast('Mechanic added')},
  saveSettings:()=>{Object.assign(S.shop,{name:val('s-name')||S.shop.name,owner:val('s-owner')||S.shop.owner,address:val('s-addr'),footer:val('s-foot')});render();toast('Settings saved')},
  toggleTheme:()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(KEY+'.theme',r.dataset.theme)}catch(e){}},
  resetAsk:()=>openSheet(shReset),
  reset:()=>{S=seed();closeSheet();go('home');toast('Demo data restored')},
  closeSheet:()=>closeSheet(),
};
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg,'copy'),()=>toast('Copy not allowed here','triangle-alert'))}catch(e){toast('Copy not allowed here','triangle-alert')}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;e.preventDefault();const f=A[el.dataset.a];if(f)f(el.dataset.v,el,e)});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='jobQ'){UI.jobQ=v;$('#jobList').innerHTML=jobListHtml();icons()}
  else if(k==='partQ'){UI.partQ=v;$('#partList').innerHTML=partListHtml();icons()}
  else if(k==='pickQ'){UI.pickQ=v;const pos=e.target.selectionStart;paintSheet();const i=$('#pickQ');i.focus();i.setSelectionRange(pos,pos)}
  else if(k.startsWith('nj:'))shNewJob.d[k.slice(3)]=v;
  else if(k==='ref')shBill.b.ref=v;
  else if(k==='cash'){shBill.b.cash=v;const j=job(SH.args[0]);const ch=(parseFloat(v)||0)-totals(j).total;const c=$('#chg');
    c.className='change'+(ch<0?' neg':'');c.innerHTML=`<span>${ch<0?'Kulang':'Sukli (change)'}</span><span class="v">${v?peso(Math.abs(ch)):'—'}</span>`}
});
document.addEventListener('change',e=>{const k=e.target.dataset.ch;if(!k||!e.target.value)return;UI[k]=e.target.value;render();const w=$('#chartWrap');if(w)w.scrollLeft=w.scrollWidth});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SH)closeSheet()});

try{const th=localStorage.getItem(KEY+'.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
